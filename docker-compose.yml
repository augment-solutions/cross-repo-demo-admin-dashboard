# E-Commerce Admin Dashboard
# ==========================
# Contains: admin-dashboard Next.js frontend for administration
#
# Note: This service depends on ecomm-core's api-gateway and shared network.
# Make sure ecomm-core is running first, or use the root docker-compose.yml
#
# Usage:
#   Start service:        docker compose up -d
#   View logs:            docker compose logs -f admin-dashboard
#   Stop service:         docker compose down

services:
  admin-dashboard:
    build:
      context: .
      dockerfile: services/admin-dashboard/Dockerfile
    container_name: ecomm-admin-dashboard
    environment:
      API_URL: http://ecomm-api-gateway:8064
      NEXT_PUBLIC_API_URL: http://localhost:8064
    ports:
      - "0.0.0.0:3001:3001"
    healthcheck:
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:3001
    networks:
      - ecomm-network
    restart: unless-stopped

networks:
  ecomm-network:
    external: true
    name: cross-repo-demo-core_ecomm-network

